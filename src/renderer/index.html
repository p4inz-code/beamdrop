<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
  <title>BeamDrop — Local Wireless Transfer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Left Sidebar: Connection & Security -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div class="brand-text">
          <h1>BeamDrop</h1>
          <span class="status-badge"><span class="status-dot"></span>Online · Local Wi-Fi</span>
        </div>
      </div>

      <div class="card qr-card">
        <img id="qr-img" alt="Scan QR with Phone" />
        <div class="url-row">
          <div class="url-pill" id="server-url">http://...</div>
          <button id="btn-copy-url" class="btn-icon" title="Copy URL">📋</button>
        </div>
        <div class="pin-row">
          <span class="pin-label">PIN</span>
          <span class="pin-code" id="pin-code">----</span>
          <button id="btn-regen-pin" class="btn-icon" title="Generate New PIN">↻</button>
        </div>
      </div>

      <div class="card controls-card">
        <label class="field-label" for="iface-select">Network Adapter</label>
        <select id="iface-select" class="select-input"></select>

        <div class="toggle-row">
          <span>Require PC Approval</span>
          <input type="checkbox" id="chk-approval" checked />
        </div>

        <div class="save-dir-box">
          <span class="field-label">Save Folder (Phone → PC)</span>
          <div class="save-dir-path" id="save-dir-path"></div>
          <div class="btn-row">
            <button id="btn-change-save" class="btn btn-sm">Change</button>
            <button id="btn-open-save" class="btn btn-sm">Open</button>
          </div>
        </div>
      </div>

      <div class="card sessions-card">
        <div class="card-header">
          <span>Connected Devices (<span id="session-count">0</span>)</span>
          <button id="btn-revoke" class="btn-link danger">Revoke All</button>
        </div>
        <ul id="sessions-list" class="sessions-list"></ul>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-area">
      <!-- Pending Approval Banner -->
      <div id="approval-banner" class="approval-banner hidden"></div>

      <!-- Drop Zone -->
      <div id="drop-zone" class="drop-zone">
        <div class="drop-content">
          <div class="drop-title">Drop 1GB+ videos, files, or folders here to share</div>
          <div class="drop-sub">Original quality · Zero cloud · Full Wi-Fi speed</div>
          <div class="drop-actions">
            <button id="btn-pick-files" class="btn btn-primary">+ Share Files</button>
            <button id="btn-pick-folder" class="btn">+ Share Folder</button>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="files">Shared Files (<span id="files-count">0</span>)</button>
        <button class="tab" data-tab="transfers">Transfers (<span id="transfers-count">0</span>)</button>
        <button class="tab" data-tab="clipboard">Clipboard &amp; Links</button>
      </div>

      <!-- Tab: Shared Files -->
      <section id="tab-files" class="tab-panel active">
        <div class="toolbar">
          <input id="file-search" type="search" class="search-input" placeholder="Filter shared files..." />
          <div class="filter-pills">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="video">Videos</button>
            <button class="pill" data-filter="image">Images</button>
            <button class="pill" data-filter="folder">Folders</button>
          </div>
        </div>
        <div id="files-list" class="item-list"></div>
      </section>

      <!-- Tab: Transfers -->
      <section id="tab-transfers" class="tab-panel">
        <div id="transfers-list" class="item-list"></div>
      </section>

      <!-- Tab: Clipboard -->
      <section id="tab-clipboard" class="tab-panel">
        <div class="clip-composer">
          <textarea id="clip-input" placeholder="Paste text or URL to send to phone..."></textarea>
          <button id="btn-send-clip" class="btn btn-primary">Send to Phone</button>
        </div>
        <div id="clip-list" class="item-list"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
