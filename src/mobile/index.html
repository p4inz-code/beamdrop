<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:;" />
  <meta name="theme-color" content="#09090b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <title>BeamDrop</title>
  <link rel="stylesheet" href="/mobile.css" />
</head>
<body>
  <!-- Auth Screen (Pro Minimal Connect) -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="auth-head">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 18V6M5 9l3-3 3 3" stroke="currentColor"/>
            <path d="M16 6v12m-3-3 3 3 3-3" stroke="#3b82f6"/>
          </svg>
        </div>
        <div class="auth-titles">
          <h1>BeamDrop</h1>
          <p class="muted">Enter the 4-digit PIN shown on your PC</p>
        </div>
      </div>

      <div class="pin-boxes" id="pin-boxes">
        <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 1" />
        <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2" />
        <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3" />
        <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4" />
      </div>

      <button id="btn-pair" class="btn btn-primary btn-full">Connect</button>
      <div id="auth-status" class="status-msg"></div>
      <div class="auth-foot">Same Wi-Fi or PC Hotspot · Private local transfer</div>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="app-screen" class="screen hidden">
    <div id="webview-banner" class="webview-banner hidden">
      <span>In-app browser detected. Open in Safari or Chrome for full-speed downloads.</span>
      <button id="btn-dismiss-wv" class="btn-link">Dismiss</button>
    </div>

    <header class="topbar">
      <div class="topbar-left">
        <span id="conn-dot" class="dot"></span>
        <strong>BeamDrop</strong>
        <span id="conn-label" class="conn-label">Connected</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-theme" class="btn-icon" title="Switch Theme" aria-label="Switch Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button id="btn-refresh" class="btn-icon" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
        <button id="btn-disconnect" class="btn btn-sm">Disconnect</button>
      </div>
    </header>

    <!-- Tab 1: Files from PC -->
    <section id="tab-files" class="tab-panel active">
      <div class="search-wrap">
        <input id="file-search" type="text" class="search-input" placeholder="Search files..." />
        <button id="btn-clear-search" class="search-clear hidden" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="filter-pills">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="video">Videos</button>
        <button class="pill" data-filter="image">Images</button>
        <button class="pill" data-filter="folder">Folders</button>
      </div>
      <div id="files-list" class="list"></div>
    </section>

    <!-- Tab 2: Send to PC -->
    <section id="tab-send" class="tab-panel">
      <input id="file-picker" type="file" multiple class="hidden" />
      <div class="send-panel-head">
        <div>
          <div class="send-hero-title">Send Files to PC</div>
          <div class="send-hero-sub">Videos, photos, audio, or documents up to 64 GB</div>
        </div>
        <button id="btn-send-files" class="btn btn-primary">Choose Files</button>
      </div>
      <div id="uploads-section" class="section-inline hidden">
        <div class="section-head">
          <h2 class="section-title">Transfer Queue</h2>
          <span id="queue-summary" class="muted"></span>
        </div>
        <div id="uploads-list" class="list"></div>
      </div>
    </section>

    <!-- Tab 3: Text & Links -->
    <section id="tab-clipboard" class="tab-panel">
      <div class="clip-box">
        <textarea id="clip-input" placeholder="Paste text or link to send to PC..."></textarea>
        <button id="btn-send-clip" class="btn btn-primary btn-full">Send to PC</button>
      </div>
      <div id="clip-list" class="list"></div>
    </section>

    <!-- Sticky Batch Action Bar -->
    <div id="batch-bar" class="batch-bar hidden">
      <div class="batch-info">
        <span id="selected-count">0 selected</span>
        <button id="btn-select-all" class="btn-link">All</button>
        <button id="btn-clear-sel" class="btn-link">Clear</button>
      </div>
      <button id="btn-download-zip" class="btn btn-primary btn-sm">Download .ZIP</button>
    </div>

    <!-- Bottom Thumb Navigation -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span>Files (<span id="files-count">0</span>)</span>
      </button>
      <button class="nav-btn" data-tab="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
        <span>Send <span id="uploads-badge" class="nav-badge hidden">0</span></span>
      </button>
      <button class="nav-btn" data-tab="clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Text &amp; Links</span>
      </button>
    </nav>
  </div>

  <!-- Video Player Modal -->
  <div id="video-modal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-header">
        <span id="video-title" class="truncate"></span>
        <button id="btn-close-video" class="btn btn-sm">Close</button>
      </div>
      <video id="video-player" controls playsinline preload="metadata"></video>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="image-modal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-header">
        <span id="image-title" class="truncate"></span>
        <button id="btn-close-image" class="btn btn-sm">Close</button>
      </div>
      <img id="image-preview" alt="Preview" />
    </div>
  </div>

  <!-- Audio Player Modal -->
  <div id="audio-modal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-header">
        <span id="audio-title" class="truncate"></span>
        <button id="btn-close-audio" class="btn btn-sm">Close</button>
      </div>
      <audio id="audio-player" controls></audio>
    </div>
  </div>

  <!-- Text & Code Reader Modal -->
  <div id="text-modal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-header">
        <span id="text-title" class="truncate"></span>
        <button id="btn-close-text" class="btn btn-sm">Close</button>
      </div>
      <pre id="text-preview" class="text-preview"></pre>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/mobile.js"></script>
</body>
</html>
