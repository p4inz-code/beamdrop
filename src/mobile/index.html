<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="/manifest.json" />
  <title>BeamDrop Mobile</title>
  <link rel="stylesheet" href="/mobile.css" />
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="logo">⚡</div>
      <h1>BeamDrop</h1>
      <p class="muted">Enter the 4-digit PIN shown on your PC</p>
      <input id="pin-input" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
      <button id="btn-pair" class="btn btn-primary btn-full">Connect</button>
      <div id="auth-status" class="status-msg"></div>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="dot"></span>
        <strong>BeamDrop</strong>
      </div>
      <button id="btn-disconnect" class="btn btn-sm">Disconnect</button>
    </header>

    <!-- Upload Action -->
    <section class="upload-bar">
      <input id="file-picker" type="file" multiple class="hidden" />
      <button id="btn-send-files" class="btn btn-primary btn-full">⬆ Send Videos / Files to PC</button>
    </section>

    <!-- Active Uploads Queue -->
    <section id="uploads-section" class="section hidden">
      <h2 class="section-title">Sending to PC</h2>
      <div id="uploads-list" class="list"></div>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="files">PC Files (<span id="files-count">0</span>)</button>
      <button class="tab" data-tab="clipboard">Clipboard</button>
    </nav>

    <!-- Files Tab -->
    <section id="tab-files" class="tab-panel active">
      <div class="filter-pills">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="video">Videos</button>
        <button class="pill" data-filter="image">Images</button>
        <button class="pill" data-filter="folder">Folders</button>
      </div>
      <div id="batch-bar" class="batch-bar hidden">
        <span id="selected-count">0 selected</span>
        <button id="btn-download-zip" class="btn btn-primary btn-sm">Download .ZIP</button>
      </div>
      <div id="files-list" class="list"></div>
    </section>

    <!-- Clipboard Tab -->
    <section id="tab-clipboard" class="tab-panel">
      <div class="clip-box">
        <textarea id="clip-input" placeholder="Paste text or link to send to PC..."></textarea>
        <button id="btn-send-clip" class="btn btn-primary">Send</button>
      </div>
      <div id="clip-list" class="list"></div>
    </section>
  </div>

  <!-- Video Player Modal -->
  <div id="video-modal" class="modal hidden">
    <div class="modal-inner">
      <div class="modal-header">
        <span id="video-title" class="truncate"></span>
        <button id="btn-close-video" class="btn btn-sm">Close</button>
      </div>
      <video id="video-player" controls playsinline preload="metadata"></video>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/mobile.js"></script>
</body>
</html>
