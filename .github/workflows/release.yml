name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Electron artifacts
        run: npx electron-builder --publish never
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.dmg *.AppImage *.deb 2>/dev/null > "SHA256SUMS-${{ matrix.os }}.txt" || true
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/SHA256SUMS-*.txt
