<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="beamWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" stroke="#2e2e36" stroke-width="6"/>

  <!-- Subtle Inner Signal Ring -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Full Symmetric Twin-Arrow Transfer Mark -->
  <!-- Left Upward Arrow (Send) -->
  <path d="M178 348 V164" fill="none" stroke="url(#beamWhite)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 214 L178 164 L228 214" fill="none" stroke="url(#beamWhite)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Downward Arrow (Drop) -->
  <path d="M334 164 V348" fill="none" stroke="url(#beamBlue)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 298 L334 348 L384 298" fill="none" stroke="url(#beamBlue)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
