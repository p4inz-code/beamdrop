<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="beamWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" stroke="#2e2e36" stroke-width="6"/>

  <!-- Subtle Inner Signal Ring -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Crisp Twin-Beam Transfer Mark (Send Up + Drop Down) -->
  <!-- Left / Upward Beam (White) -->
  <path d="M196 348 V176 L142 230" fill="none" stroke="url(#beamWhite)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right / Downward Beam (Cobalt Blue) -->
  <path d="M316 164 V336 L370 282" fill="none" stroke="url(#beamBlue)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Wireless Pulse Node -->
  <circle cx="256" cy="256" r="16" fill="#3b82f6"/>
  <circle cx="256" cy="256" r="7" fill="#ffffff"/>
</svg>
